[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xquantum-trichology"
version = "0.1.0"
description = "Reproducible hair and scalp image research with structured clinical context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4", "scikit-learn==1.9.1", "Pillow==13.0.0",
  "pydantic==2.14.2", "fastapi==0.162.0", "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "build==1.6.1", "httpx2==2.16.0"]

[project.scripts]
xquantum = "xquantum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=xquantum --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

